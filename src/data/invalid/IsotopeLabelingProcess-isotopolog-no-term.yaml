# Invalid for one reason: isotopolog has a raw value but no term. Its range is
# ControlledIdentifiedTermValue, which requires term. A labeled input with no PubChem
# compound identifier belongs in hetero_isotopolog.
id: nmdc:labp-99-abcdf11
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: single
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: root exudates
