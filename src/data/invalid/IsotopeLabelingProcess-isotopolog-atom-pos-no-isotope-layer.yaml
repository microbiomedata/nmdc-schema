# Invalid for one reason: isotopolog_atom_pos has no isotope layer (/i...), so it does not
# say which atoms are labeled. The InChI is one of @kheal's invalid glutamate examples.
id: nmdc:labp-99-abcde12
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: single
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog_atom_pos: InChI=1S/C5H9NO4/c6-3(5(9)10)1-2-4(7)8/h3H,1-2,6H2,(H,7,8)(H,9,10)
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: L-glutamic acid [CHEBI:16015]
      term:
        id: CHEBI:16015
        name: L-glutamic acid
        type: nmdc:OntologyClass
