# Invalid only because the required has_input is absent.
id: nmdc:isolp-99-labeled
type: nmdc:IsotopeLabelingProcess
name: 'labeled: toluene incubation'
has_output:
- nmdc:procsm-99-labeledinc
added_isotopologs:
- isotopolog_label: isotopically labeled
  type: nmdc:IsotopologAddition
  isotopolog: toluene
  isotope_atom_fractions:
  - isotope: 13C
    type: nmdc:IsotopologComposition
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_numeric_value: 0.99
      has_unit: '1'
  isotopolog_dose:
    type: nmdc:QuantityValue
    has_numeric_value: 10
    has_unit: '[ppm]'
  isotopolog_atom_pos: InChI=1S/C7H8/c1-7-5-3-2-4-6-7/h2-6H,1H3/i1+1,2+1,3+1,4+1,5+1,6+1,7+1
isotopolog_approach: single
isotopolog_incu_time:
  type: nmdc:QuantityValue
  has_numeric_value: 12
  has_unit: h
