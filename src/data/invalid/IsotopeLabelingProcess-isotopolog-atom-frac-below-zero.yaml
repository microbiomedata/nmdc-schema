# Invalid for one reason: isotopolog_atom_frac.has_numeric_value is -0.5, outside 0 to 1.
# An atom fraction is the share of the element's atoms that carry the heavy isotope.
id: nmdc:labp-99-abcdef8
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: single
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_raw_value: "-0.5"
      has_numeric_value: -0.5
      has_unit: "1"
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: glucose [CHEBI:17234]
      term:
        id: CHEBI:17234
        name: glucose
        type: nmdc:OntologyClass
