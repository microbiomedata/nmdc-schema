# Invalid for one reason: isotopolog.term.id is the sentinel PUBCHEM.COMPOUND:0, which is
# not a real compound identifier. PubChem's API returns HTTP 400 for CID 0.
id: nmdc:labp-99-abcdef7
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: single
isotope_label_metadata:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopeMetadata 
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: an undefined mixture [PUBCHEM.COMPOUND:0]
      term:
        id: PUBCHEM.COMPOUND:0
        name: an undefined mixture
