# Invalid only because isotopolog_approach must be single or multiple.
id: nmdc:labp-99-labeled
type: nmdc:IsotopeLabelingProcess
name: 'labeled: toluene incubation'
has_input:
- nmdc:bsm-99-sipdemo
has_output:
- nmdc:procsm-99-labeledinc
isotopolog_additions:
- isotopolog_label: isotopically labeled
  isotope: 13C
  type: nmdc:IsotopologAddition
  isotopolog:
    type: nmdc:ControlledIdentifiedTermValue
    has_raw_value: toluene [PUBCHEM.COMPOUND:1140]
    term:
      id: PUBCHEM.COMPOUND:1140
      name: toluene
      type: nmdc:OntologyClass
  isotopolog_atom_frac:
    type: nmdc:QuantityValue
    has_numeric_value: 0.99
    has_unit: '1'
  isotopolog_dose:
    type: nmdc:QuantityValue
    has_numeric_value: 10
    has_unit: '[ppm]'
  isotopolog_atom_pos:
    type: nmdc:TextValue
    has_raw_value: 1S/C7H8/c1-7-5-3-2-4-6-7/h2-6H,1H3/i1+1,2+1,3+1,4+1,5+1,6+1,7+1
isotopolog_approach: simultaneous
isotopolog_incu_time:
  type: nmdc:QuantityValue
  has_numeric_value: 12
  has_unit: h
