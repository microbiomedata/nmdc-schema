# Self-contained synthetic DNA-SIP lifecycle. See src/docs/sip-lifecycle.md. No real experimental results.
study_set:
- id: nmdc:sty-99-sipdemo
  type: nmdc:Study
  name: Synthetic paired DNA-SIP demonstration
  study_category: research_study
  description: 'Illustrative metadata only: invented measurements, identifiers and file URLs. Three fractions
    per gradient keep the example small; this is not a laboratory protocol or a complete experimental
    design.'
biosample_set:
- id: nmdc:bsm-99-sipdemo
  name: Soil for paired SIP microcosms
  associated_studies:
  - nmdc:sty-99-sipdemo
  env_broad_scale:
    type: nmdc:ControlledIdentifiedTermValue
    has_raw_value: ENVO:00002030
    term:
      type: nmdc:OntologyClass
      id: ENVO:00002030
  env_local_scale:
    type: nmdc:ControlledIdentifiedTermValue
    has_raw_value: ENVO:00002169
    term:
      type: nmdc:OntologyClass
      id: ENVO:00002169
  env_medium:
    type: nmdc:ControlledIdentifiedTermValue
    has_raw_value: ENVO:00005792
    term:
      type: nmdc:OntologyClass
      id: ENVO:00005792
  type: nmdc:Biosample
  description: Synthetic source sample. Separate aliquots enter the labeled and natural-abundance incubations;
    aliquoting is implicit.
material_processing_set:
- id: nmdc:labp-99-labeled
  type: nmdc:IsotopeLabelingProcess
  name: 'labeled: toluene incubation'
  has_input:
  - nmdc:bsm-99-sipdemo
  has_output:
  - nmdc:procsm-99-labeledinc
  isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: toluene [PUBCHEM.COMPOUND:1140]
      term:
        id: PUBCHEM.COMPOUND:1140
        name: toluene
        type: nmdc:OntologyClass
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_numeric_value: 0.99
      has_unit: '1'
    isotopolog_dose:
      type: nmdc:QuantityValue
      has_numeric_value: 10
      has_unit: '[ppm]'
    isotopolog_atom_pos:
      type: nmdc:TextValue
      has_raw_value: 1S/C7H8/c1-7-5-3-2-4-6-7/h2-6H,1H3/i1+1,2+1,3+1,4+1,5+1,6+1,7+1
  isotopolog_approach: single
  isotopolog_incu_time:
    type: nmdc:QuantityValue
    has_numeric_value: 12
    has_unit: h
- id: nmdc:extrp-99-labeled
  type: nmdc:Extraction
  name: 'labeled: extract DNA'
  has_input:
  - nmdc:procsm-99-labeledinc
  has_output:
  - nmdc:procsm-99-labeleddna
  extraction_targets:
  - DNA
- id: nmdc:fracp-99-labeled
  type: nmdc:DensityGradientFractionationProcess
  name: 'labeled: density gradient'
  has_input:
  - nmdc:procsm-99-labeleddna
  has_output:
  - nmdc:procsm-99-labeledfrac1
  - nmdc:procsm-99-labeledfrac2
  - nmdc:procsm-99-labeledfrac3
  protocol_link:
    type: nmdc:Protocol
    name: DNA-SIP gradient centrifugation and fractionation
    url: https://doi.org/10.3791/2027
    protocol_for: DensityGradientFractionationProcess
- id: nmdc:extrp-99-labeledclean1
  type: nmdc:Extraction
  name: 'labeled: recover fraction 1 DNA'
  has_input:
  - nmdc:procsm-99-labeledfrac1
  has_output:
  - nmdc:procsm-99-labeledclean1
  extraction_targets:
  - DNA
  description: Recover and purify DNA from the collected gradient fraction before library preparation.
- id: nmdc:libprp-99-labeled1
  type: nmdc:LibraryPreparation
  name: 'labeled: fraction 1 library'
  has_input:
  - nmdc:procsm-99-labeledclean1
  has_output:
  - nmdc:procsm-99-labeledlib1
  library_type: DNA
  library_strategy: WGS
  library_source: METAGENOMIC
  lib_layout: paired
- id: nmdc:extrp-99-labeledclean2
  type: nmdc:Extraction
  name: 'labeled: recover fraction 2 DNA'
  has_input:
  - nmdc:procsm-99-labeledfrac2
  has_output:
  - nmdc:procsm-99-labeledclean2
  extraction_targets:
  - DNA
  description: Recover and purify DNA from the collected gradient fraction before library preparation.
- id: nmdc:libprp-99-labeled2
  type: nmdc:LibraryPreparation
  name: 'labeled: fraction 2 library'
  has_input:
  - nmdc:procsm-99-labeledclean2
  has_output:
  - nmdc:procsm-99-labeledlib2
  library_type: DNA
  library_strategy: WGS
  library_source: METAGENOMIC
  lib_layout: paired
- id: nmdc:extrp-99-labeledclean3
  type: nmdc:Extraction
  name: 'labeled: recover fraction 3 DNA'
  has_input:
  - nmdc:procsm-99-labeledfrac3
  has_output:
  - nmdc:procsm-99-labeledclean3
  extraction_targets:
  - DNA
  description: Recover and purify DNA from the collected gradient fraction before library preparation.
- id: nmdc:libprp-99-labeled3
  type: nmdc:LibraryPreparation
  name: 'labeled: fraction 3 library'
  has_input:
  - nmdc:procsm-99-labeledclean3
  has_output:
  - nmdc:procsm-99-labeledlib3
  library_type: DNA
  library_strategy: WGS
  library_source: METAGENOMIC
  lib_layout: paired
- id: nmdc:labp-99-control
  type: nmdc:IsotopeLabelingProcess
  name: 'control: toluene incubation'
  has_input:
  - nmdc:bsm-99-sipdemo
  has_output:
  - nmdc:procsm-99-controlinc
  isotopolog_additions:
  - isotopolog_label: natural abundance
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: toluene [PUBCHEM.COMPOUND:1140]
      term:
        id: PUBCHEM.COMPOUND:1140
        name: toluene
        type: nmdc:OntologyClass
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_numeric_value: 0.011
      has_unit: '1'
    isotopolog_dose:
      type: nmdc:QuantityValue
      has_numeric_value: 10
      has_unit: '[ppm]'
  isotopolog_approach: single
  isotopolog_incu_time:
    type: nmdc:QuantityValue
    has_numeric_value: 12
    has_unit: h
- id: nmdc:extrp-99-control
  type: nmdc:Extraction
  name: 'control: extract DNA'
  has_input:
  - nmdc:procsm-99-controlinc
  has_output:
  - nmdc:procsm-99-controldna
  extraction_targets:
  - DNA
- id: nmdc:fracp-99-control
