  extraction_targets:
  - DNA
  description: Recover and purify DNA from the collected gradient fraction before library preparation.
- id: nmdc:libprp-99-control2
  type: nmdc:LibraryPreparation
  name: 'control: fraction 2 library'
  has_input:
  - nmdc:procsm-99-controlclean2
  has_output:
  - nmdc:procsm-99-controllib2
  library_type: DNA
  library_strategy: WGS
  library_source: METAGENOMIC
