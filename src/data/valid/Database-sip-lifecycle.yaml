    name: DNA-SIP gradient centrifugation and fractionation
    url: https://doi.org/10.3791/2027
    protocol_for: DensityGradientFractionationProcess
- id: nmdc:extrp-99-controlclean1
  type: nmdc:Extraction
  name: 'control: recover fraction 1 DNA'
  has_input:
  - nmdc:procsm-99-controlfrac1
  has_output:
