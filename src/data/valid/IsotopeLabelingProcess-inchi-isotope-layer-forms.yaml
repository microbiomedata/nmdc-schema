# Two InChI isotope-layer forms that isotopolog_atom_pos must accept: deuterium written as an
# isotopic hydrogen layer (/i/hD2, ChEBI's own InChI for heavy water), and a two-component salt
# whose layers are separated by ";" (13C sodium acetate, InChI from PubChem).
id: nmdc:labp-99-abcde14
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: multiple
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 2H
    type: nmdc:IsotopologAddition
    isotopolog_atom_pos: InChI=1S/H2O/h1H2/i/hD2
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: water [CHEBI:15377]
      term:
        id: CHEBI:15377
        name: water
        type: nmdc:OntologyClass
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog_atom_pos: InChI=1S/C2H4O2.Na/c1-2(3)4;/h1H3,(H,3,4);/q;+1/p-1/i2+1;
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: acetic acid [CHEBI:15366]
      term:
        id: CHEBI:15366
        name: acetic acid
        type: nmdc:OntologyClass
