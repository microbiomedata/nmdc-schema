# Valid. Two isotopologs were added to the same sample, each with its own PubChem compound.
id: nmdc:labp-99-abcdef4
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: multiple
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: toluene [CHEBI:17578]
      term:
        id: CHEBI:17578
        name: toluene
        type: nmdc:OntologyClass
  - isotopolog_label: isotopically labeled
    isotope: 18O
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: water [CHEBI:15377]
      term:
        id: CHEBI:15377
        name: water
        type: nmdc:OntologyClass
