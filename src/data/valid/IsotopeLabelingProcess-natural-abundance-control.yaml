# A natural-abundance control: the same compound as the labeled treatment, with no
# isotopolog_atom_pos, because an InChI isotope layer can only describe enrichment.
id: nmdc:labp-99-abcde15
name: unlabeled control for my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123457
has_output:
  - nmdc:procsm-99-987655
isotopolog_approach: single
isotopolog_additions:
  - isotopolog_label: natural abundance
    isotope: 13C
    type: nmdc:IsotopologAddition
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: L-glutamic acid [CHEBI:16015]
      term:
        id: CHEBI:16015
        name: L-glutamic acid
        type: nmdc:OntologyClass
