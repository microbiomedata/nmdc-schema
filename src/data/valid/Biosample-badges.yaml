# A Biosample carrying awarded metadata-quality badges.
#
# Badges are asserted by a downstream service, not by a submitter.
#
# The two badges here are ones a single real sample plausibly earns together: a
# plant rhizosphere soil sample, characterized both chemically and by its host.
# Each is justified well above its badge_minimum_slots of 1, so this example
# stays valid if the squad raises either bar:
#
#   biogeochemistry   6 populated (ph, nitrate, ammonium, tot_org_carb,
#                     tot_nitro_content, diss_org_carb)
#   host_association  5 populated (host_name, host_taxid, host_genus,
#                     host_species, host_life_stage)
#
# expert_curation is not shown. It is awarded from
# ProvenanceMetadata.source_system_of_record rather than from slot completeness,
# so no combination of populated slots earns it.
