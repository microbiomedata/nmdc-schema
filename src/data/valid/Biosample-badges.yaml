# A Biosample carrying one awarded metadata-quality badge.
#
# Badges are asserted by a downstream service, not by a submitter.
#
# This record earns biogeochemistry and does not earn host_association, which is
# the point of the example: both subsets have populated slots, but only one
# clears its badge_minimum_slots of 2.
#
#   biogeochemistry   6 of 44 slots populated (ph, nitrate, ammonium,
#                     tot_org_carb, tot_nitro_content, diss_org_carb)
#                     6 >= 2, so the badge is awarded
#   host_association  1 of 35 slots populated (host_name)
#                     1 < 2, so no badge, even though the sample has a host
#
# A sample with a host but only one host slot filled is the ordinary case in
# NMDC, and the portal shows only badges a sample has earned, so the absence
# reads as "not enough host metadata" rather than "no host".
#
# expert_curation cannot be illustrated by slot values at all. It is awarded
# from ProvenanceMetadata.source_system_of_record, so no combination of
# populated slots earns it.
