# A Biosample carrying one awarded metadata-quality badge.
#
# Badges are asserted by a downstream service, not by a submitter.
#
# This is a soil sample characterized chemically. It populates 6 of the 44 slots
# in the biogeochemistry subset (ph, nitrate, ammonium, tot_org_carb,
# tot_nitro_content, diss_org_carb), which clears that subset's
# badge_minimum_slots of 2, so it is awarded the biogeochemistry badge.
#
# It populates no host_information slots and earns no host badge. That is the
# normal case rather than an omission: environmental samples characterized by
# their chemistry generally have no host organism, and host-associated samples
# are generally not the ones carrying a full analyte panel. The two badges are
# not expected to co-occur, and the portal shows only badges a sample earns.
#
# expert_curation cannot be illustrated by slot values at all. It is awarded
# from ProvenanceMetadata.source_system_of_record, so no combination of
# populated slots earns it.
