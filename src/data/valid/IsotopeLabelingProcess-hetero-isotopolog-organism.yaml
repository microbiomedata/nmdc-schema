# Valid. The only labeled input is an organism, not a molecular entity, so it is named in
# hetero_isotopolog and isotopolog is omitted. Inspired by https://pubmed.ncbi.nlm.nih.gov/34576747/,
# which added 13C-labeled T4 phages to activated sludge.
id: nmdc:isolp-99-abcdef8
name: labeling of my awesome biosample
type: nmdc:IsotopeLabelingProcess
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987654
isotopolog_approach: single
added_isotopologs:
  - isotopolog_label: isotopically labeled
    isotope_atom_fractions:
      - isotope: 13C
        type: nmdc:IsotopologComposition
    type: nmdc:IsotopologAddition
    hetero_isotopolog: T4 phages
