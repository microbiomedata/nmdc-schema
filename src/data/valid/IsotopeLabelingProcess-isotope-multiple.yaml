# Example inspired by https://doi.org/10.1038/ismej.2014.205, proposed adjustments to modeling
id: nmdc:labp-99-abcdef2
name: labeling of my awesome biosample
has_input:
  - nmdc:bsm-99-123456
has_output:
  - nmdc:procsm-99-987650
isotopolog_approach: multiple
isotopolog_additions:
  - isotopolog_label: isotopically labeled
    type: nmdc:IsotopologAddition
    isotope: 13C
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_raw_value: "0.99"
      has_numeric_value: 0.99
      has_unit: "1"
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: glucose [CHEBI:17234]
      term:
        id: CHEBI:17234
        name: glucose
        type: nmdc:OntologyClass
  - isotopolog_label: isotopically labeled
    type: nmdc:IsotopologAddition
    isotope: 18O
    isotopolog_atom_frac:
      type: nmdc:QuantityValue
      has_raw_value: "0.99"
      has_numeric_value: 0.99
      has_unit: "1"
    isotopolog_atom_pos: InChI=1S/H2O/h1H2/i1+2
    isotopolog:
      type: nmdc:ControlledIdentifiedTermValue
      has_raw_value: water [CHEBI:15377]
      term:
        id: CHEBI:15377
        name: water
        type: nmdc:OntologyClass
isotopolog_incu_time:
  type: nmdc:QuantityValue
  has_raw_value: 168 h
  has_numeric_value: 168
  has_unit: h
type: nmdc:IsotopeLabelingProcess
