name: Auto-deployment of nmdc-schema Documentation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}  # default deny; the job below grants only what it needs

# Cancel outdated runs when new commits are pushed to main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build and deploy documentation
    permissions:
      contents: write  # push the built docs to the gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] this workflow pushes to gh-pages via
        # `mkdocs gh-deploy --force`, which relies on the persisted checkout
        # token. Proper hardening (push with an explicit scoped token, then set
        # persist-credentials: false) is tracked in #3147.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python 3.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies.
        run: uv sync --locked

      # Replace the `0.0.0` placeholder `version` in src/schema/nmdc.yaml with the
      # version uv-dynamic-versioning derives from the git tags (see `set-version` in Makefile).
      - name: Replace placeholder version number
        run: |
          make set-version

      # Note: `make all` includes `gendoc` (via site target), so no separate gendoc step needed
      - name: Clean previous build artifacts
        run: make squeaky-clean

      - name: Build schema and documentation
        run: make all

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

        # Deploy the docs to GitHub Pages.
        #
        # Note: The `make mkd-gh-deploy` command below uses the `mkd-%` target
        #       defined in `Makefile`. That target's action (i.e. recipe)
        #       strips off the `mkd-` prefix and passes the rest of the command
        #       to `$ uv run mkdocs`, effectively translating the command
        #       below into `$ uv run mkdocs gh-deploy`.
        #
        # Reference: https://www.mkdocs.org/user-guide/deploying-your-docs/
        #
        # MAM 2025-10-20 switching back from `make mkd-gh-deploy` to invocation
        # outside of make in order to use the --force option
      - name: Deploy web-based documentation to GitHub Pages
        run: |
          uv run mkdocs gh-deploy --force
