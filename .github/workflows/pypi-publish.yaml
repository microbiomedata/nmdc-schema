name: Publish Python Package

on:
  release:
    types: [created]

permissions: {}  # default deny; the publish job below grants only id-token: write

# Never cancel an in-progress publish: interrupting a release mid-upload could
# leave a partial upload. Grouped per ref so re-triggering the same release does
# not publish it twice concurrently; unrelated releases still publish in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # mandatory for OIDC trusted publishing (no other scope needed)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Do not persist the checkout token in .git/config. Publishing uses OIDC
        # trusted publishing, the version comes from pyproject.toml and the checks read only
        # the checked-out files, so no step here needs the token (zizmor artipacked, #3148).
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # No uv cache on the release trigger, for the same reason as below
        # (zizmor cache-poisoning, #3148).
        enable-cache: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        # No dependency cache on the release trigger: a cache poisoned by a
        # less-privileged PR run must not reach the publish job. Trade-off is a
        # slower job (deps re-download); correctness is unaffected
        # (zizmor cache-poisoning, #3148).

    - name: Install project dependencies
      run: uv sync --locked

    # The package ships the artifacts committed by `make release`. First check that
    # the tag, pyproject.toml, package.json and every generated file agree on the version.
    # GITHUB_REF_NAME is the release tag, e.g. v11.26.0-rc.1.
    - name: Check versions against the release tag
      run: uv run python src/scripts/release.py check-artifacts --tag "$GITHUB_REF_NAME"

    # Rebuild from source in this clean environment and fail if the result differs
    # from the committed artifacts (stale files, or a drifted local build environment).
    - name: Rebuild the artifacts and compare them with the committed ones
      run: |
        make set-version
        make squeaky-clean all
        make -C units fast
        git diff --exit-code --stat -- nmdc_schema/
        untracked="$(git ls-files --others --exclude-standard -- nmdc_schema/)"
        if [ -n "$untracked" ]; then
          echo "The rebuild created files that aren't committed (the wheel would include them):"
          echo "$untracked"
          exit 1
        fi

    - name: Build source and wheel archives
      run: uv build

    - name: Publish distribution 📦 to PyPI
      # No username or password because we're using trusted publishing
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
