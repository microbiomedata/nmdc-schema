name: Python lint (ruff)

# Lints hand-written Python with ruff, the single linter + formatter that
# replaced black, flake8, isort, bandit, and pydocstyle (see [tool.ruff] in
# pyproject.toml). ruff runs from the uv environment so the version is
# pinned by uv.lock.

on:
  pull_request:
  push:
    branches: [ main ]

permissions: {}  # default deny; the job below grants only what it needs

# One lint run per ref; a newer push supersedes an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guards against poetry.lock being committed. This is a uv project; uv.lock is
  # the tracked lock file. The project moved from Poetry to uv in issue 2761, and
  # a poetry.lock can come back if someone runs Poetry here out of habit.
  # .gitignore covers the accidental case but not `git add -f`, so this check is
  # the backstop.
  lockfile-guard:
    name: lockfile-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repository to inspect its tracked files
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `git ls-files` asks whether the file is TRACKED, which is the actual rule.
      # A `test -f` would also fire on a contributor's git-ignored local copy.
      - name: Fail if poetry.lock is tracked
        run: |
          if git ls-files --error-unmatch poetry.lock > /dev/null 2>&1; then
            echo "::error file=poetry.lock::poetry.lock is tracked, but this is a uv project and uv.lock is the tracked lock file. Remove it (git rm --cached poetry.lock); it is already covered by .gitignore. See https://github.com/microbiomedata/nmdc-schema/issues/2761."
            exit 1
          fi
          echo "OK: poetry.lock is not tracked."

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repository to lint it
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      # Formatting is not yet gated: the existing code is not uniformly
      # ruff-format-clean. A one-time `make format` sweep (~75 files) and the
      # blocking format check are tracked in #3166, kept separate to avoid
      # mixing large churn into this PR.

      # Non-blocking until the known src/scripts findings (#3164) are cleared,
      # mirroring how the zizmor job is non-blocking. Once #3164 is done, add
      # "S" to select in [tool.ruff.lint] and remove this step.
      - name: Ruff security scan (non-blocking)
        continue-on-error: true
        # S101 (assert) is ignored only for tests/** via [tool.ruff.lint]
        # per-file-ignores, so asserts elsewhere still surface here.
        run: uv run ruff check --select S .
